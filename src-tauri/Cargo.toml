[package]
name = "harbor"
version = "0.1.0"
description = "A focused GitHub desktop workspace"
edition = "2021"
authors = ["Excelius-Wang"]
license = "AGPL-3.0-only"
repository = "https://github.com/Excelius-Wang/harbor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
git2 = { version = "0.21", features = ["https", "vendored-libgit2"] }
httparse = "1"
keyring = "4.1.6"
octocrab = "0.54.1"
rmcp = { version = "3.1.4", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2.5"
oauth2 = { version = "5.0.0", features = ["timing-resistant-secret-traits"] }
tauri-plugin-dialog = "2"
http = "1"
http-body-util = "0.1"
percent-encoding = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
